                        "velocity-red": "#ff4d4d",
                        "primary-container": "#ff5352",
                        "surface-base": "#121212",

                        "on-tertiary-container": "#2a2a2a",

<style>
        .glass-panel {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .input-focus-ring:focus-within {
            border-bottom-color: theme('colors.velocity-red');
            box-shadow: 0 1px 0 theme('colors.velocity-red');
        }
        .glow-effect {
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.05);
        }
    </style>
</head>
<body class="bg-surface-base text-text-primary min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-velocity-red/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-[600px] h-[600px] bg-surface-elevated/20 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Canvas (No Nav Shell as per rules for Linear/Transactional intent) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative z-10 w-full max-w-max-width mx-auto">
<div class="glass-panel rounded-xl w-full max-w-md overflow-hidden glow-effect transition-all duration-300">
<!-- Progress Bar Header -->
<div class="w-full bg-surface-container-highest h-1">
<div aria-valuemax="100" aria-valuemin="0" aria-valuenow="33" class="bg-velocity-red h-full w-1/3 transition-all duration-500 ease-out" role="progressbar"></div>
</div>
<div class="p-8 flex flex-col gap-8">
<!-- Branding & Title -->
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-text-primary font-bold tracking-tight">Claim Your Identity</h1>
<p class="font-body-sm text-body-sm text-text-secondary">Your handle on the bobsled.gg network.</p>
</div>
<!-- Input Area -->
<div class="space-y-4">
<label class="font-label-caps text-label-caps text-text-muted uppercase block" for="username">Username</label>
<div class="relative flex items-center bg-surface-container rounded-DEFAULT border-b border-glass-border transition-colors duration-200 input-focus-ring">
<span class="pl-4 font-body-md text-body-md text-text-muted select-none">@</span>
<input autocomplete="off" class="w-full bg-transparent border-none text-text-primary font-body-md text-body-md py-3 px-3 focus:ring-0 placeholder-surface-container-high outline-none" id="username" name="username" placeholder="pilot_zero" spellcheck="false" type="text"/>
<!-- Status Icon (Hidden by default, shown via JS ideally) -->
<div class="pr-4 hidden" id="status-icon">
<span class="material-symbols-outlined text-text-muted text-[20px]" data-icon="check_circle">check_circle</span>
</div>
</div>
<!-- Helper Text / Validation Message -->
<div class="flex justify-between items-center min-h-[20px]">
<p class="font-body-sm text-body-sm text-text-secondary" id="username-helper">4-15 characters, alphanumeric and underscores.</p>
<span class="font-label-caps text-label-caps text-text-muted hidden" id="availability-badge">AVAILABLE</span>
</div>
</div>
<!-- Actions -->
<div class="pt-4 mt-2 border-t border-glass-border">
<button class="w-full bg-velocity-red text-text-primary font-label-caps text-label-caps uppercase py-4 rounded-DEFAULT font-bold tracking-wider hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2 group" type="button">
                        Confirm Username
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="text-center mt-6">
<a class="font-body-sm text-body-sm text-text-muted hover:text-text-primary transition-colors duration-200" href="#">Skip for now</a>
</div>
</div>
</div>
</div>
</main>
<!-- Footer Component Execution -->
<footer class="bg-surface-container-lowest border-t border-glass-border w-full relative z-10">
<div class="flex flex-col md:flex-row justify-between items-center w-full py-8 px-margin-desktop max-w-max-width mx-auto gap-4 md:gap-0">
<div class="font-label-caps text-label-caps text-text-muted">
                © 2024 bobsled.gg. Instant Settlements Guaranteed.
            </div>
<nav class="flex gap-6">
<a class="font-body-sm text-body-sm text-text-muted hover:text-velocity-red transition-colors opacity-80 hover:opacity-100" href="#">Privacy</a>
<a class="font-body-sm text-body-sm text-text-muted hover:text-velocity-red transition-colors opacity-80 hover:opacity-100" href="#">Terms</a>
<a class="font-body-sm text-body-sm text-text-muted hover:text-velocity-red transition-colors opacity-80 hover:opacity-100" href="#">Support</a>
</nav>
</div>
</footer>
<script>
        // Micro-interaction for input validation simulation
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('username');
            const statusIcon = document.getElementById('status-icon');
            const helperText = document.getElementById('username-helper');
            const availabilityBadge = document.getElementById('availability-badge');
            
            input.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                
                if (val.length > 3) {
                    // Simulate validation success
                    statusIcon.classList.remove('hidden');
                    statusIcon.querySelector('span').classList.remove('text-text-muted', 'text-error');
                    statusIcon.querySelector('span').classList.add('text-primary');
                    statusIcon.querySelector('span').textContent = 'check_circle';
                    
                    helperText.classList.remove('text-error');
                    helperText.classList.add('text-primary');
                    helperText.textContent = 'Looks good.';
                    
                    availabilityBadge.classList.remove('hidden');
                    availabilityBadge.classList.add('text-primary', 'bg-primary-container/10', 'px-2', 'py-1', 'rounded-DEFAULT');
                } else if (val.length > 0) {
                    // Simulate typing/invalid state
                    statusIcon.classList.add('hidden');
                    
                    helperText.classList.remove('text-primary');
                    helperText.classList.add('text-text-secondary');
                    helperText.textContent = 'Keep typing... (4 min)';
                    
                    availabilityBadge.classList.add('hidden');
                } else {
                    // Reset
                    statusIcon.classList.add('hidden');
                    helperText.classList.remove('text-primary', 'text-error');
                    helperText.classList.add('text-text-secondary');
                    helperText.textContent = '4-15 characters, alphanumeric and underscores.';
                    availabilityBadge.classList.add('hidden');
                }
            });
        });
    </script>
</body></html>
