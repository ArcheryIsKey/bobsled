<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>bobsled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="description" content="Connect 4" />
  </head>
  <body>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      if (typeof window !== 'undefined' && window.fetch) {
        try {
          Object.defineProperty(window, 'fetch', {
            value: window.fetch,
            writable: true,
            configurable: true
          });
        } catch (e) {
          console.warn('Could not redefine window.fetch', e);
        }
      }

      // Automatically refresh page if a stale chunk fails to load after a new deployment
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) || '';
        var isScriptError = e && e.target && e.target.tagName === 'SCRIPT';
        if (isScriptError || msg.indexOf('dynamically imported module') !== -1 || msg.indexOf('MIME type') !== -1) {
          var key = 'bobsled_chunk_reload';
          var lastReload = sessionStorage.getItem(key);
          if (!lastReload || Date.now() - parseInt(lastReload, 10) > 10000) {
            sessionStorage.setItem(key, Date.now().toString());
            window.location.reload();
          }
        }
      }, true);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
